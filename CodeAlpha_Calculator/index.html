<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">

        <div class="calculator-header">
            <h1>Calculator</h1>
            <p>Simple • Fast • Responsive</p>
        </div>

        <div class="display">
            <div id="previous-display"></div>
            <input type="text" id="current-display" value="0" readonly>
        </div>

        <div class="buttons">

            <button class="btn action" onclick="clearDisplay()">AC</button>
            <button class="btn action" onclick="deleteLast()">DEL</button>
            <button class="btn operator" onclick="chooseOperator('%')">%</button>
            <button class="btn operator" onclick="chooseOperator('/')">÷</button>

            <button class="btn" onclick="appendNumber('7')">7</button>
            <button class="btn" onclick="appendNumber('8')">8</button>
            <button class="btn" onclick="appendNumber('9')">9</button>
            <button class="btn operator" onclick="chooseOperator('*')">×</button>

            <button class="btn" onclick="appendNumber('4')">4</button>
            <button class="btn" onclick="appendNumber('5')">5</button>
            <button class="btn" onclick="appendNumber('6')">6</button>
            <button class="btn operator" onclick="chooseOperator('-')">−</button>

            <button class="btn" onclick="appendNumber('1')">1</button>
            <button class="btn" onclick="appendNumber('2')">2</button>
            <button class="btn" onclick="appendNumber('3')">3</button>
            <button class="btn operator" onclick="chooseOperator('+')">+</button>

            <button class="btn zero" onclick="appendNumber('0')">0</button>
            <button class="btn" onclick="appendDecimal()">.</button>
            <button class="btn equal" onclick="calculate()">=</button>

        </div>

        <div class="footer">
            <span>CodeAlpha Frontend Internship</span>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
